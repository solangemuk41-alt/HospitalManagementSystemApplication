server:
  port: 8080

spring:
  application:
    name: hospitalms

  datasource:
    url: jdbc:postgresql://localhost:5432/hospitalms_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    # Change this secret in production - must be at least 256 bits for HS256
    secret: "hospitalms-super-secret-key-change-me-in-production-1234567890"
    expiration-ms: 86400000   # 24 hours

  file:
    upload-dir: uploads/prescriptions
